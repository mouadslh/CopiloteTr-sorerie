[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilote-tresorerie"
version = "0.1.0"
description = "Copilote de tresorerie deterministe pour PME marocaines"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "pandas>=2,<4",
  "lxml>=5,<7",
  "Jinja2>=3.1,<4",
  "streamlit>=1.35,<2",
  "pdfplumber>=0.11,<1",
  "reportlab>=4,<5",
  "matplotlib>=3.8,<4",
  "pytest>=8,<9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

